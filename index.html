<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Down</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }
        .icon {
            font-size: 4em;
            color: red;
        }
        h1 {
            font-size: 3em;
            margin: 10px 0;
        }
        p {
            font-size: 1.5em;
            margin-top: 10px;
        }
        .details {
            position: absolute;
            bottom: 20px;
            font-size: 0.8em;
            color: #888;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div>
        <div class="icon">⚠️</div>
        <h1>This Site Is Private</h1>
        <p>Server Is Down</p>
    </div>

    <div class="details">
        <p>
            Possible causes: server maintenance, DNS resolution failure, network timeout, or internal server error (500).
            <br>
            Please check your internet connection or try again later.
        </p>
    </div>
</body>
</html>
